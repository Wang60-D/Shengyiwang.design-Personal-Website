<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="420" fill="#FFFFFF"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1F2933">屈曲 ROM 进阶曲线 与 角度墙</text>
  <text x="40" y="64" font-size="13" fill="#8A96A3">目标随周数抬升;角度墙始终略高于目标作为安全保护上限</text>

  <!-- phase bands -->
  <rect x="80" y="80" width="246" height="260" fill="#E8F0FE" opacity="0.5"/>
  <rect x="326" y="80" width="328" height="260" fill="#E4F3EB" opacity="0.5"/>
  <rect x="654" y="80" width="246" height="260" fill="#FBEEE2" opacity="0.5"/>
  <text x="203" y="100" font-size="12" font-weight="600" fill="#3F6FB0" text-anchor="middle">早期保护期</text>
  <text x="490" y="100" font-size="12" font-weight="600" fill="#2F9E6B" text-anchor="middle">中期恢复期</text>
  <text x="777" y="100" font-size="12" font-weight="600" fill="#D67D3E" text-anchor="middle">后期功能期</text>

  <!-- axes -->
  <line x1="80" y1="80" x2="80" y2="340" stroke="#C7D0DA" stroke-width="1.5"/>
  <line x1="80" y1="340" x2="900" y2="340" stroke="#C7D0DA" stroke-width="1.5"/>
  <!-- y ticks -->
  <g font-size="11" fill="#8A96A3" text-anchor="end">
    <text x="72" y="344">0°</text>
    <text x="72" y="292">30°</text>
    <text x="72" y="240">60°</text>
    <text x="72" y="188">90°</text>
    <text x="72" y="136">120°</text>
    <text x="72" y="98">~145°</text>
  </g>
  <!-- x ticks -->
  <g font-size="11" fill="#8A96A3" text-anchor="middle">
    <text x="80" y="360">W0</text>
    <text x="326" y="360">W6</text>
    <text x="654" y="360">W14</text>
    <text x="900" y="360">W20+</text>
  </g>

  <!-- wall line -->
  <polyline points="80,219 162,175 244,132 326,115 408,115 531,106 654,97 818,96 900,93"
            fill="none" stroke="#E5564B" stroke-width="2.5" stroke-dasharray="6 4"/>
  <!-- target line -->
  <polyline points="80,236 162,184 244,149 326,132 408,123 531,115 654,106 818,101 900,97"
            fill="none" stroke="#3F6FB0" stroke-width="3"/>
  <!-- target points -->
  <g fill="#3F6FB0">
    <circle cx="80" cy="236" r="4"/><circle cx="162" cy="184" r="4"/><circle cx="244" cy="149" r="4"/>
    <circle cx="326" cy="132" r="4"/><circle cx="531" cy="115" r="4"/><circle cx="654" cy="106" r="4"/><circle cx="900" cy="97" r="4"/>
  </g>

  <!-- legend -->
  <line x1="640" y1="392" x2="680" y2="392" stroke="#3F6FB0" stroke-width="3"/>
  <text x="688" y="396" font-size="12" fill="#5A6573">屈曲目标</text>
  <line x1="770" y1="392" x2="810" y2="392" stroke="#E5564B" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="818" y="396" font-size="12" fill="#5A6573">角度墙(保护上限)</text>

  <!-- annotation -->
  <text x="92" y="232" font-size="11" fill="#3F6FB0">60°</text>
  <text x="252" y="146" font-size="11" fill="#3F6FB0">~110°</text>
  <text x="540" y="111" font-size="11" fill="#3F6FB0">~130°</text>
</svg>
