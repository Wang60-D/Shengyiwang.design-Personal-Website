<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="440" fill="#FFFFFF"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1F2933">安全回撤助力 · 触发与状态机</text>
  <text x="40" y="64" font-size="13" fill="#8A96A3">够不到目标是安全的;够不到还硬撑、腿发抖才危险 → 把腿接回伸直位</text>

  <!-- left: concept gauge -->
  <text x="40" y="104" font-size="14" font-weight="700" fill="#1F2933">膝关节屈曲轴(理念)</text>
  <line x1="60" y1="140" x2="60" y2="360" stroke="#D4DBE3" stroke-width="2"/>
  <!-- safe zone -->
  <rect x="50" y="330" width="220" height="30" fill="#E4F3EB"/>
  <text x="80" y="350" font-size="12" font-weight="600" fill="#2F9E6B">安全位 ~0° 伸直/直立(回撤目标)</text>
  <!-- working zone -->
  <rect x="50" y="200" width="220" height="130" fill="#F4F6F8"/>
  <text x="80" y="240" font-size="12" fill="#5A6573">主动训练区(够到这里=正常)</text>
  <text x="80" y="262" font-size="12" fill="#5A6573">够不到目标 = 安全,不强推</text>
  <!-- danger marker -->
  <circle cx="160" cy="200" r="6" fill="#E8A33C"/>
  <text x="80" y="190" font-size="12" font-weight="600" fill="#E8A33C">卡住/发抖处 → 介入</text>
  <!-- target -->
  <line x1="50" y1="160" x2="270" y2="160" stroke="#3F6FB0" stroke-dasharray="5 4" stroke-width="2"/>
  <text x="80" y="154" font-size="12" font-weight="600" fill="#3F6FB0">目标角度(不主动帮够到)</text>
  <!-- return arrow -->
  <path d="M250 200 C290 250 290 300 250 345" fill="none" stroke="#3F6FB0" stroke-width="3" marker-end="url(#b)"/>
  <text x="300" y="276" font-size="12" font-weight="700" fill="#3F6FB0">回撤</text>

  <!-- right: state machine -->
  <text x="420" y="104" font-size="14" font-weight="700" fill="#1F2933">状态机</text>
  <rect x="420" y="124" width="180" height="64" rx="12" fill="#F4F6F8" stroke="#9AA7B4" stroke-width="2"/>
  <text x="510" y="150" font-size="15" font-weight="700" fill="#1F2933" text-anchor="middle">FREE 透明</text>
  <text x="510" y="172" font-size="11" fill="#8A96A3" text-anchor="middle">患者自己主动动</text>

  <rect x="700" y="124" width="200" height="64" rx="12" fill="#EAF1FA" stroke="#3F6FB0" stroke-width="2"/>
  <text x="800" y="150" font-size="15" font-weight="700" fill="#1F2933" text-anchor="middle">RETURN 回撤</text>
  <text x="800" y="172" font-size="11" fill="#5A6573" text-anchor="middle">限速送回安全位,扭矩封顶</text>

  <path d="M600 145 L700 145" stroke="#E8A33C" stroke-width="2.5" marker-end="url(#o)"/>
  <text x="650" y="136" font-size="11" font-weight="600" fill="#E8A33C" text-anchor="middle">挣扎信号</text>
  <path d="M700 175 C650 215 650 215 600 178" fill="none" stroke="#34A853" stroke-width="2.5" marker-end="url(#g4)"/>
  <text x="650" y="214" font-size="11" font-weight="600" fill="#34A853" text-anchor="middle">到安全位 / 恢复主动控制</text>

  <!-- triggers -->
  <text x="420" y="262" font-size="14" font-weight="700" fill="#1F2933">三类触发信号</text>
  <rect x="420" y="278" width="480" height="44" rx="9" fill="#FFF7EC" stroke="#F0D9AE"/>
  <text x="436" y="298" font-size="13" font-weight="600" fill="#C77D1A">① 长时间停留</text>
  <text x="436" y="316" font-size="12" fill="#5A6573">卡在某角度上不去也不退、在硬撑(角速度低,持续 2–3s)</text>
  <rect x="420" y="330" width="480" height="44" rx="9" fill="#FFF7EC" stroke="#F0D9AE"/>
  <text x="436" y="350" font-size="13" font-weight="600" fill="#C77D1A">② 数据快速波动(抖动)★</text>
  <text x="436" y="368" font-size="12" fill="#5A6573">腿开始发抖 = 疲劳/失控;短窗膝角标准差或角速度过零率超阈</text>
  <rect x="420" y="382" width="480" height="44" rx="9" fill="#FFF7EC" stroke="#F0D9AE"/>
  <text x="436" y="402" font-size="13" font-weight="600" fill="#C77D1A">③ 突然打软(兜底)</text>
  <text x="436" y="420" font-size="12" fill="#5A6573">瞬间失力下沉,屈曲向角速度骤增 → 接住防跌倒</text>

  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#3F6FB0"/></marker>
    <marker id="o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#E8A33C"/></marker>
    <marker id="g4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#34A853"/></marker>
  </defs>
</svg>
