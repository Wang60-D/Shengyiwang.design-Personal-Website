<svg viewBox="0 0 920 520" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="metal2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eceded"/>
      <stop offset="0.5" stop-color="#c7c9cc"/>
      <stop offset="1" stop-color="#e8e9ea"/>
    </linearGradient>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9e9ea0"/>
    </marker>
  </defs>

  <!-- ============ 1 · 支具 ============ -->
  <!-- 大腿环 -->
  <rect x="95" y="95" width="110" height="44" rx="14" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/>
  <rect x="103" y="103" width="94" height="28" rx="10" fill="#1b2333"/>
  <circle cx="185" cy="117" r="3" fill="#36c5d8"/>
  <!-- 连杆 -->
  <rect x="143" y="139" width="14" height="46" fill="#e3e4e6"/>
  <rect x="147" y="141" width="6" height="42" rx="3" fill="#cfd2d6"/>
  <!-- 电机盘 -->
  <circle cx="150" cy="225" r="40" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/>
  <circle cx="150" cy="225" r="30" fill="#f0f0f2"/>
  <circle cx="150" cy="225" r="22" fill="url(#metal2)"/>
  <circle cx="150" cy="225" r="26" fill="none" stroke="#36c5d8" stroke-width="1.8" stroke-dasharray="122 41" stroke-linecap="round" transform="rotate(-90 150 225)"/>
  <!-- 下连杆 + 小腿环 -->
  <rect x="143" y="265" width="14" height="35" fill="#e3e4e6"/>
  <rect x="147" y="267" width="6" height="31" rx="3" fill="#cfd2d6"/>
  <rect x="95" y="300" width="110" height="44" rx="14" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/>
  <rect x="103" y="308" width="94" height="28" rx="10" fill="#1b2333"/>
  <circle cx="115" cy="322" r="8" fill="#3a3d42"/>

  <!-- ============ 2 · Mac 上位机 ============ -->
  <rect x="320" y="120" width="150" height="100" rx="8" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/>
  <rect x="330" y="130" width="130" height="80" rx="4" fill="#0e1217"/>
  <line x1="334" y1="152" x2="456" y2="152" stroke="#2a2f36" stroke-width="1"/>
  <line x1="334" y1="172" x2="456" y2="172" stroke="#2a2f36" stroke-width="1"/>
  <line x1="334" y1="192" x2="456" y2="192" stroke="#2a2f36" stroke-width="1"/>
  <polyline points="335,195 355,185 375,190 395,170 415,160 435,168 455,150" fill="none" stroke="#0071e3" stroke-width="2.5" stroke-linejoin="round"/>
  <polyline points="335,201 380,199 420,197 455,197" fill="none" stroke="#36c5d8" stroke-width="1.5"/>
  <rect x="305" y="220" width="180" height="12" rx="5" fill="#e3e4e6" stroke="#d2d2d7" stroke-width="0.8"/>

  <!-- ============ 3 · iPhone ============ -->
  <rect x="585" y="105" width="80" height="160" rx="18" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/>
  <rect x="592" y="112" width="66" height="146" rx="12" fill="#fbfbfd" stroke="#ececf1" stroke-width="1"/>
  <rect x="612" y="119" width="26" height="9" rx="4.5" fill="#1d1d1f"/>
  <rect x="598" y="140" width="54" height="36" rx="8" fill="#0a7281" fill-opacity="0.14"/>
  <rect x="604" y="148" width="28" height="6" rx="3" fill="#0a7281" fill-opacity="0.8"/>
  <rect x="604" y="160" width="40" height="4" rx="2" fill="#0a7281" fill-opacity="0.35"/>
  <rect x="598" y="184" width="54" height="28" rx="8" fill="#ececf1"/>
  <rect x="604" y="192" width="34" height="5" rx="2.5" fill="#c9ccd3"/>
  <rect x="598" y="218" width="54" height="28" rx="8" fill="#ececf1"/>
  <rect x="604" y="226" width="26" height="5" rx="2.5" fill="#c9ccd3"/>
  <rect x="613" y="251" width="24" height="3" rx="1.5" fill="#d2d2d7"/>

  <!-- ============ 4 · Apple Watch ============ -->
  <path d="M796,125 L844,125 L838,98 L802,98 Z" fill="#e8e8ed"/>
  <path d="M796,235 L844,235 L838,262 L802,262 Z" fill="#e8e8ed"/>
  <rect x="780" y="125" width="80" height="110" rx="22" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/>
  <rect x="789" y="134" width="62" height="92" rx="16" fill="#0e1217"/>
  <rect x="860" y="158" width="6" height="20" rx="3" fill="#d2d2d7"/>
  <rect x="860" y="188" width="6" height="26" rx="3" fill="#e3e4e6"/>
  <!-- 触觉波纹 -->
  <path d="M816.5,174.6 A7,7 0 0 1 816.5,185.4" fill="none" stroke="#36c5d8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M821,169.3 A14,14 0 0 1 821,190.7" fill="none" stroke="#36c5d8" stroke-width="2.5" stroke-opacity="0.65" stroke-linecap="round"/>
  <path d="M825.5,163.9 A21,21 0 0 1 825.5,196.1" fill="none" stroke="#36c5d8" stroke-width="2.5" stroke-opacity="0.35" stroke-linecap="round"/>

  <!-- ============ 通信链路 ============ -->
  <line x1="215" y1="205" x2="310" y2="205" stroke="#9e9ea0" stroke-width="1.8" stroke-dasharray="6 5" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
  <text x="262" y="190" font-size="13.5" fill="#6e6e73" text-anchor="middle">膝角 · 力数据</text>
  <text x="262" y="228" font-size="13.5" fill="#6e6e73" text-anchor="middle">电机指令</text>

  <line x1="490" y1="205" x2="577" y2="205" stroke="#9e9ea0" stroke-width="1.8" stroke-dasharray="6 5" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
  <text x="533" y="190" font-size="13.5" fill="#6e6e73" text-anchor="middle">训练状态</text>

  <line x1="673" y1="205" x2="772" y2="205" stroke="#9e9ea0" stroke-width="1.8" stroke-dasharray="6 5" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
  <text x="722" y="190" font-size="13.5" fill="#6e6e73" text-anchor="middle">触觉指令</text>

  <!-- ============ 名称 + 分工标签 ============ -->
  <text x="150" y="392" font-size="18" font-weight="600" fill="#1d1d1f" text-anchor="middle">支具</text>
  <rect x="92" y="406" width="116" height="27" rx="13.5" fill="none" stroke="#0a7281" stroke-width="1.5"/>
  <text x="150" y="424" font-size="13.5" font-weight="600" fill="#0a7281" text-anchor="middle">采集 · 力反馈</text>

  <text x="395" y="392" font-size="18" font-weight="600" fill="#1d1d1f" text-anchor="middle">Mac 上位机</text>
  <rect x="344" y="406" width="102" height="27" rx="13.5" fill="none" stroke="#0a7281" stroke-width="1.5"/>
  <text x="395" y="424" font-size="13.5" font-weight="600" fill="#0a7281" text-anchor="middle">运算 · 直驱</text>

  <text x="625" y="392" font-size="18" font-weight="600" fill="#1d1d1f" text-anchor="middle">iPhone</text>
  <rect x="581" y="406" width="88" height="27" rx="13.5" fill="none" stroke="#0a7281" stroke-width="1.5"/>
  <text x="625" y="424" font-size="13.5" font-weight="600" fill="#0a7281" text-anchor="middle">交互界面</text>

  <text x="820" y="392" font-size="18" font-weight="600" fill="#1d1d1f" text-anchor="middle">Apple Watch</text>
  <rect x="776" y="406" width="88" height="27" rx="13.5" fill="none" stroke="#0a7281" stroke-width="1.5"/>
  <text x="820" y="424" font-size="13.5" font-weight="600" fill="#0a7281" text-anchor="middle">触觉提示</text>

  <!-- 底注 -->
  <text x="460" y="482" font-size="14.5" fill="#86868b" text-anchor="middle">安全事件 · 多通道冗余同时触发</text>
</svg>
