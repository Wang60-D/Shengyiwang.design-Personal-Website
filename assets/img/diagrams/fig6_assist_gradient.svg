<svg viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="300" fill="#FFFFFF"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1F2933">助力梯度 · 越往后越放手</text>
  <text x="40" y="64" font-size="13" fill="#8A96A3">回撤助力灵敏度随康复递减;触发次数下降本身即客观进步信号</text>

  <!-- descending wedge -->
  <path d="M80 110 L880 110 L880 230 L80 200 Z" fill="url(#grad)" opacity="0.85"/>
  <line x1="80" y1="250" x2="880" y2="250" stroke="#D4DBE3" stroke-width="2"/>

  <!-- phase dividers -->
  <line x1="346" y1="100" x2="346" y2="258" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="613" y1="100" x2="613" y2="258" stroke="#FFFFFF" stroke-width="3"/>

  <text x="213" y="170" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">高</text>
  <text x="480" y="170" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">中</text>
  <text x="746" y="175" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">低 / 关</text>

  <text x="213" y="278" font-size="14" font-weight="600" fill="#3F6FB0" text-anchor="middle">早期保护期</text>
  <text x="480" y="278" font-size="14" font-weight="600" fill="#2F9E6B" text-anchor="middle">中期恢复期</text>
  <text x="746" y="278" font-size="14" font-weight="600" fill="#D67D3E" text-anchor="middle">后期功能期</text>

  <text x="213" y="98" font-size="11" fill="#5A6573" text-anchor="middle">肌力弱易疲劳,早接住</text>
  <text x="480" y="98" font-size="11" fill="#5A6573" text-anchor="middle">仅明显脱力/抖动才接</text>
  <text x="746" y="98" font-size="11" fill="#5A6573" text-anchor="middle">仅打软兜底</text>

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3F6FB0"/>
      <stop offset="0.5" stop-color="#2F9E6B"/>
      <stop offset="1" stop-color="#D67D3E"/>
    </linearGradient>
  </defs>
</svg>
