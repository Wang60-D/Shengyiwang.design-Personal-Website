<svg viewBox="0 0 960 430" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="430" fill="#FFFFFF"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1F2933">电机三种控制模式 · 叠加与优先级</text>
  <text x="40" y="64" font-size="13" fill="#8A96A3">三种模式是叠加关系,不是互斥;安全永远优先</text>

  <!-- mode cards -->
  <g>
    <rect x="40" y="96" width="270" height="150" rx="12" fill="#F4F6F8" stroke="#9AA7B4" stroke-width="2"/>
    <circle cx="72" cy="128" r="9" fill="#9AA7B4"/>
    <text x="92" y="133" font-size="17" font-weight="700" fill="#1F2933">FREE 自由 / 透明</text>
    <text x="60" y="164" font-size="13" fill="#4A5663">重力+摩擦补偿,关节"轻若无物"</text>
    <text x="60" y="188" font-size="13" fill="#4A5663">只测,不拦不帮</text>
    <text x="60" y="222" font-size="12" fill="#8A96A3">默认基线 · 所有主动训练</text>
  </g>
  <g>
    <rect x="345" y="96" width="270" height="150" rx="12" fill="#FCF1F0" stroke="#E5564B" stroke-width="2"/>
    <circle cx="377" cy="128" r="9" fill="#E5564B"/>
    <text x="397" y="133" font-size="17" font-weight="700" fill="#1F2933">WALL 角度墙</text>
    <text x="365" y="164" font-size="13" fill="#4A5663">在 ROM 边界用位置环形成虚拟墙</text>
    <text x="365" y="188" font-size="13" fill="#4A5663">越界给阻挡扭矩(已实现)</text>
    <text x="365" y="222" font-size="12" fill="#8A96A3">安全兜底层 · 始终在线</text>
  </g>
  <g>
    <rect x="650" y="96" width="270" height="150" rx="12" fill="#EAF1FA" stroke="#3F6FB0" stroke-width="2"/>
    <circle cx="682" cy="128" r="9" fill="#3F6FB0"/>
    <text x="702" y="133" font-size="16" font-weight="700" fill="#1F2933">ASSIST 安全回撤</text>
    <text x="670" y="164" font-size="13" fill="#4A5663">卡住/发抖时把腿送回伸直位</text>
    <text x="670" y="188" font-size="13" fill="#4A5663">永远朝安全位,绝不推向目标</text>
    <text x="670" y="222" font-size="12" fill="#8A96A3">挣扎信号触发 · 新增</text>
  </g>

  <!-- priority chain -->
  <text x="40" y="300" font-size="14" font-weight="700" fill="#1F2933">优先级(高 → 低)</text>
  <g font-size="14" font-weight="600">
    <rect x="40" y="318" width="180" height="52" rx="10" fill="#7A1F1A"/>
    <text x="130" y="350" fill="#FFFFFF" text-anchor="middle">安全事件 暂停/急停</text>
    <rect x="262" y="318" width="150" height="52" rx="10" fill="#E5564B"/>
    <text x="337" y="350" fill="#FFFFFF" text-anchor="middle">WALL 硬限位</text>
    <rect x="454" y="318" width="170" height="52" rx="10" fill="#3F6FB0"/>
    <text x="539" y="350" fill="#FFFFFF" text-anchor="middle">ASSIST 软助力</text>
    <rect x="666" y="318" width="150" height="52" rx="10" fill="#9AA7B4"/>
    <text x="741" y="350" fill="#FFFFFF" text-anchor="middle">FREE 基线</text>
  </g>
  <path d="M220 344 L262 344" stroke="#B7C2CF" stroke-width="3" marker-end="url(#a3)"/>
  <path d="M412 344 L454 344" stroke="#B7C2CF" stroke-width="3" marker-end="url(#a3)"/>
  <path d="M624 344 L666 344" stroke="#B7C2CF" stroke-width="3" marker-end="url(#a3)"/>
  <text x="40" y="402" font-size="12" fill="#8A96A3">助力永远在墙以内工作;助力是"软"的,患者反向用力或喊停,电机即让位。</text>

  <defs>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#B7C2CF"/></marker>
  </defs>
</svg>
